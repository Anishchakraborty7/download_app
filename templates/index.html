<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Splitter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <div class="card">
        <h1>🎬 Video Splitter</h1>
        <p class="subtitle">
            Upload a video, choose duration, and download perfectly split clips.
        </p>

        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>Upload Video</label>
                <input type="file" name="video" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Min Duration (minutes)</label>
                    <input type="number" name="min_duration" value="5" min="1" required>
                </div>

                <div class="form-group">
                    <label>Max Duration (minutes)</label>
                    <input type="number" name="max_duration" value="7" min="1" required>
                </div>
            </div>

            <button type="submit" class="btn">
                Generate Clips
            </button>
        </form>

        <p class="footer-text">
            Videos are processed securely and deleted automatically.
        </p>
    </div>
</div>

</body>
</html>
