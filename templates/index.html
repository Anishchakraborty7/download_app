<!DOCTYPE html>
<html>
<head>
    <title>Video Splitter App</title>
</head>
<body>

<h2>Upload Video & Generate Clips</h2>

<form method="POST" enctype="multipart/form-data">
    <label>Upload Video:</label><br>
    <input type="file" name="video" required><br><br>

    <label>Min Duration (minutes):</label><br>
    <input type="number" name="min_duration" value="5" min="1" required><br><br>

    <label>Max Duration (minutes):</label><br>
    <input type="number" name="max_duration" value="7" min="1" required><br><br>

    <button type="submit">Generate Clips</button>
</form>

</body>
</html>
